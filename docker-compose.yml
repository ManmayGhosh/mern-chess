services:
  mongo:
    image: mongo:7
    container_name: netcode-mongo
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: netcode-demo-mern:latest
    container_name: netcode-app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - MONGO_URI=mongodb://mongo:27017/netcode-demo
    depends_on:
      - mongo
    restart: unless-stopped

volumes:
  mongo-data:
